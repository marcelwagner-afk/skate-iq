# GitHub Pages Deployment – baut IMMER die Demo-Variante (synthetische Daten).
# Echte Verbandsdaten sind gitignored und können hier nie landen; ein Wächter-
# Schritt bricht das Deployment ab, falls doch je echte Daten im Build auftauchen.
# Die geschützte Echtdaten-Version (login/index.html, AES-verschlüsselt durch
# deploy/protect.py) wird – falls vorhanden – mit ausgeliefert.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Demo-Build (synthetische Daten)
        run: npm run build
      - name: "Wächter: keine Echtdaten im öffentlichen Build"
        run: |
          if ls src/data-real/*.local.json 2>/dev/null; then
            echo "::error::Echtdaten-Bundle im Repo gefunden – Abbruch."; exit 1; fi
          if grep -rl "ath_real_" dist/assets/ 2>/dev/null; then
            echo "::error::Echte Athleten-IDs im Demo-Build gefunden – Abbruch."; exit 1; fi
          echo "OK: Build ist rein synthetisch."
      - name: Geschützte Echtdaten-Login-Seite mit ausliefern (falls vorhanden)
        run: if [ -d login ]; then cp -r login dist/login; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
